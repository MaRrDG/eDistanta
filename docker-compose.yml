version: '3.8'
services:
  api:
    build: .
    container_name: edistanta-api
    command: ["/app/start.sh", "api"]
    ports:
      - "9001:9001"
    restart: always
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "job=edistanta,service=api"
        
  web:
    build: .
    container_name: edistanta-web
    command: ["/app/start.sh", "web"]
    ports:
      - "3002:3002"
    restart: always
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "job=edistanta,service=web"